<html lang="en">

<style>
  :root{
    --glass:rgba(22,20,40,.55); --glass2:rgba(30,26,54,.65); --stroke:rgba(167,139,250,.22);
    --text:#EDE9FE; --text2:#B9AEE0; --muted:#7A6FA8; --accent:#8B5CF6; --accent2:#C084FC;
    --like:#34D399; --nope:#FB7185; --super:#FBBF24; --code:rgba(8,6,20,.7);
  }
  *{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text); overflow:hidden; overscroll-behavior:none; background:#0a0718;
  }
  .bg{position:fixed; inset:-6%; z-index:-3; background:url(__BG__) center/cover no-repeat; animation:drift 46s ease-in-out infinite alternate; filter:saturate(1.1);}
  @keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.09) translate(-1.6%,1.8%)}}
  .bg::after{content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 120%, rgba(10,7,24,.85), rgba(10,7,24,.25) 55%, rgba(10,7,24,.45));}
  #stars{position:fixed; inset:0; z-index:-2; pointer-events:none;}
  #fx{position:fixed; inset:0; z-index:90; pointer-events:none;}

  #splash{position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(10,7,24,.6); backdrop-filter:blur(6px); transition:opacity .6s, visibility .6s;}
  #splash.hide{opacity:0; visibility:hidden;}
  .biglogo{font-size:64px; animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .wordmark{font-size:40px; font-weight:900; letter-spacing:-1.5px; background:linear-gradient(90deg,#C084FC,#8B5CF6,#F0ABFC); -webkit-background-clip:text; background-clip:text; color:transparent; background-size:200%; animation:sheen 3s linear infinite;}
  @keyframes sheen{to{background-position:200%}}
  .tagline{color:var(--text2); font-size:14px; letter-spacing:.4px;}
  .startbtn{margin-top:14px; background:linear-gradient(135deg,#8B5CF6,#C026D3); border:none; color:#fff; font-size:16px; font-weight:800; padding:15px 44px; border-radius:999px; cursor:pointer; box-shadow:0 8px 40px rgba(139,92,246,.5); transition:transform .15s;}
  .startbtn:hover{transform:scale(1.06);}

  .app{height:100dvh; display:flex; flex-direction:column; max-width:470px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top)) 14px calc(74px + env(safe-area-inset-bottom));}
  header{display:flex; align-items:center; justify-content:space-between; padding:4px 4px 8px;}
  .logo{font-weight:900; font-size:19px; letter-spacing:-.5px; background:linear-gradient(90deg,#C084FC,#8B5CF6); -webkit-background-clip:text; background-clip:text; color:transparent; display:flex; align-items:center; gap:7px;}
  .logo span{-webkit-text-fill-color:initial;}
  .streak{font-size:12px; font-weight:800; color:var(--super); background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.25); padding:5px 11px; border-radius:999px;}
  .live{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:#6EE7B7; background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.3); padding:5px 11px; border-radius:999px; letter-spacing:.5px;}
  .live .ldot{width:7px; height:7px; border-radius:50%; background:#34D399; animation:blink 1.6s ease-in-out infinite; box-shadow:0 0 8px rgba(52,211,153,.8);}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .hright{display:flex; gap:7px; align-items:center;}
  .chips{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chchip{flex-shrink:0; font-size:11.5px; font-weight:700; padding:7px 13px; border-radius:999px; background:var(--glass); color:var(--muted); border:1px solid var(--stroke); cursor:pointer; backdrop-filter:blur(10px); transition:all .2s;}
  .chchip.on{background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(192,38,211,.25)); color:#E9D5FF; border-color:rgba(192,132,252,.6); box-shadow:0 0 18px rgba(139,92,246,.25);}
  .chchip .x{margin-left:6px; opacity:.6; font-weight:900;}
  .chchip .x:hover{opacity:1;}
  .addinput{flex-shrink:0; width:150px; background:rgba(8,6,20,.5); border:1px solid var(--stroke); border-radius:999px; color:var(--text); font-size:11.5px; font-weight:600; padding:7px 13px; outline:none; display:none;}
  .addinput.show{display:block;}
  .addinput::placeholder{color:var(--muted);}

  .stage{flex:1; position:relative; perspective:1200px; min-height:0;}
  .card{position:absolute; inset:0; border-radius:28px; overflow:hidden; display:flex; flex-direction:column; touch-action:none;
    background:var(--glass2); border:1px solid var(--stroke); backdrop-filter:blur(18px);
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); transform-style:preserve-3d;}
  .card.top{cursor:grab; z-index:2;}
  .card.next{transform:scale(.94) translateY(18px); opacity:.75; z-index:1;}
  .shine{position:absolute; inset:0; background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%); transform:translateX(-120%); pointer-events:none; z-index:5;}
  .card.top:hover .shine{animation:sweep 1.6s ease forwards;}
  @keyframes sweep{to{transform:translateX(120%)}}
  .hero{height:34%; position:relative; flex-shrink:0; background:linear-gradient(160deg,rgba(76,29,149,.5),rgba(15,10,34,.6));}
  .hero img.og{width:100%; height:100%; object-fit:cover; display:block; mask-image:linear-gradient(#000 70%,transparent);}
  .hero .avatarfall{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .hero .avatarfall img{width:80px; height:80px; border-radius:50%; box-shadow:0 0 44px rgba(139,92,246,.6);}
  .mcpbadge{position:absolute; top:10px; left:10px; background:linear-gradient(135deg,#8B5CF6,#C026D3); color:#fff; font-size:11px; font-weight:800; padding:6px 11px; border-radius:999px; box-shadow:0 4px 16px rgba(139,92,246,.5);}
  .herobtns{position:absolute; top:10px; right:10px; z-index:7; display:flex; gap:6px;}
  .cardbtn{width:36px; height:36px; border-radius:50%; border:1px solid var(--stroke); background:rgba(10,7,24,.55); backdrop-filter:blur(8px); color:#DDD6FE; font-size:15px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; padding:0;}
  .cardbtn:hover{background:rgba(139,92,246,.5); transform:scale(1.1);}
  .cbody{flex:1; padding:10px 18px 14px; display:flex; flex-direction:column; min-height:0;}
  .rname{font-size:25px; font-weight:900; letter-spacing:-.6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rowner{font-size:13px; font-weight:600; color:var(--accent2); margin-top:1px;}
  .bul{list-style:none; margin-top:9px; display:flex; flex-direction:column; gap:5px; overflow:hidden; min-height:0;}
  .bul li{font-size:12.5px; line-height:1.45; color:var(--text2); padding-left:15px; position:relative; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .bul li::before{content:"▸"; color:var(--accent2); position:absolute; left:0; top:0;}
  .bul li.ph{color:var(--muted); font-style:italic;}
  .tagrow{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;}
  .tag{font-size:10.5px; font-weight:700; padding:5px 10px; border-radius:999px; background:rgba(122,111,168,.15); color:var(--text2); border:1px solid rgba(122,111,168,.2); display:flex; align-items:center; gap:5px; max-width:150px; white-space:nowrap; overflow:hidden;}
  .tag.acc{background:rgba(139,92,246,.18); color:#DDD6FE; border-color:rgba(139,92,246,.35);}
  .dot{width:7px; height:7px; border-radius:50%;}
  .stats{display:flex; margin-top:auto; background:rgba(8,6,20,.35); border-radius:16px; padding:10px 4px;}
  .stat{flex:1; text-align:center;}
  .stat .v{font-size:13.5px; font-weight:900;}
  .stat .l{font-size:9px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.5px;}
  .stamp{position:absolute; font-size:28px; font-weight:900; letter-spacing:3px; padding:6px 16px; border:4px solid; border-radius:12px; background:rgba(8,6,20,.5); opacity:0; pointer-events:none; z-index:6; backdrop-filter:blur(4px);}
  .stamp.add{top:40px; left:22px; color:var(--like); border-color:var(--like); transform:rotate(-14deg); text-shadow:0 0 24px rgba(52,211,153,.8);}
  .stamp.pass{top:40px; right:22px; color:var(--nope); border-color:var(--nope); transform:rotate(14deg); text-shadow:0 0 24px rgba(251,113,133,.8);}
  .stamp.super{bottom:80px; left:50%; color:var(--super); border-color:var(--super); transform:translateX(-50%) rotate(-6deg); text-shadow:0 0 24px rgba(251,191,36,.8);}
  .glow{position:absolute; inset:0; border-radius:28px; border:3px solid transparent; opacity:0; pointer-events:none; z-index:6;}
  .back{padding:12px 18px; overflow-y:auto; flex:1; scrollbar-width:thin;}
  .back h3{font-size:14px; font-weight:900; margin:10px 0 6px; color:#DDD6FE;}
  .codebox{background:var(--code); border:1px solid var(--stroke); border-radius:12px; padding:10px; margin-top:6px;}
  .codebox .cl{display:flex; justify-content:space-between; font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; margin-bottom:5px;}
  .codebox .copy{color:var(--accent2); cursor:pointer;}
  .codebox code{font-family:ui-monospace,Menlo,monospace; font-size:11px; word-break:break-all; display:block; white-space:pre-wrap;}
  .readme{font-size:12px; line-height:1.55; color:var(--text2); white-space:pre-wrap; font-family:ui-monospace,Menlo,monospace;}
  .backfoot{border-top:1px solid var(--stroke); padding:11px 18px; display:flex; justify-content:space-between; flex-shrink:0;}
  .backfoot a{color:var(--accent2); font-size:12px; font-weight:700; text-decoration:none;}

  .actions{display:flex; justify-content:center; align-items:center; gap:22px; padding:14px 0 8px;}
  .abtn{width:58px; height:58px; border-radius:50%; border:1px solid var(--stroke); background:var(--glass); backdrop-filter:blur(14px); font-size:24px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s, box-shadow .15s;}
  .abtn:active{transform:scale(.85);}
  .abtn.nope:hover{box-shadow:0 0 26px rgba(251,113,133,.5); transform:scale(1.12);}
  .abtn.like:hover{box-shadow:0 0 26px rgba(52,211,153,.5); transform:scale(1.12);}
  .abtn.sup{width:46px; height:46px; font-size:19px;}
  .abtn.sup:hover{box-shadow:0 0 26px rgba(251,191,36,.55); transform:scale(1.12);}
  .abtn.undo{width:42px; height:42px; font-size:16px; opacity:.35;}
  .abtn.undo.can{opacity:1;}
  .abtn.info{width:42px; height:42px; font-size:16px;}

  .view{flex:1; overflow-y:auto; padding:4px 2px 20px; display:none; min-height:0;}
  .vtitle{font-size:24px; font-weight:900; padding:6px 4px 12px; letter-spacing:-.5px;}
  .glasscard{background:var(--glass); border:1px solid var(--stroke); border-radius:18px; backdrop-filter:blur(14px); overflow:hidden; margin-bottom:14px;}
  .seclabel{font-size:10px; font-weight:800; letter-spacing:1.4px; color:var(--muted); margin:4px 4px 6px;}
  .srow{display:flex; gap:11px; align-items:center; padding:13px 15px; border-bottom:1px solid rgba(122,111,168,.12); animation:rise .35s ease both; cursor:pointer; transition:background .15s;}
  .srow:hover{background:rgba(139,92,246,.08);}
  .srow:last-child{border-bottom:none;}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .srow img{width:42px; height:42px; border-radius:50%;}
  .sn{font-size:13.5px; font-weight:800;}
  .sd{font-size:11.5px; color:var(--text2); margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .rowbtns{margin-left:auto; display:flex; gap:2px; flex-shrink:0;}
  .mini{background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; padding:6px; border-radius:8px; transition:all .15s;}
  .mini:hover{background:rgba(139,92,246,.2); color:#DDD6FE;}
  .btnrow{display:flex; gap:8px; padding:0 2px 12px;}
  .gbtn{flex:1; background:linear-gradient(135deg,#8B5CF6,#C026D3); border:none; color:#fff; font-weight:800; font-size:13px; padding:13px; border-radius:14px; cursor:pointer; box-shadow:0 6px 24px rgba(139,92,246,.35); transition:transform .15s;}
  .gbtn:active{transform:scale(.96);}
  .gbtn.alt{background:var(--glass); border:1px solid var(--stroke); color:var(--text2); box-shadow:none;}
  .empty{text-align:center; color:var(--muted); padding:70px 30px; font-size:13.5px; line-height:1.7;}
  .empty .e{font-size:46px; display:block; margin-bottom:12px;}
  .packsearch{width:100%; box-sizing:border-box; background:rgba(8,6,20,.5); border:1px solid var(--stroke); border-radius:999px; color:var(--text); font-size:13px; padding:12px 16px; outline:none; margin:0 0 4px; backdrop-filter:blur(10px);}
  .packsearch:focus{border-color:rgba(192,132,252,.6); box-shadow:0 0 18px rgba(139,92,246,.2);}
  .packsearch::placeholder{color:var(--muted);}
  .packgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 2px;}
  .packtile{background:var(--glass); border:1px solid var(--stroke); border-radius:18px; backdrop-filter:blur(14px); padding:16px 14px; cursor:pointer; transition:all .2s; animation:rise .35s ease both;}
  .packtile:hover{border-color:rgba(192,132,252,.6); box-shadow:0 0 22px rgba(139,92,246,.25); transform:translateY(-2px);}
  .packtile .pe{font-size:28px; display:block; margin-bottom:8px;}
  .packtile .pt{font-size:14px; font-weight:900;}
  .packtile .pb{font-size:10.5px; color:var(--muted); margin-top:4px; line-height:1.45;}
  .packstar{font-size:10.5px; color:var(--super); font-weight:800; margin-left:4px; white-space:nowrap;}
  .picktag{font-size:9px; font-weight:800; letter-spacing:.4px; color:#E9D5FF; background:linear-gradient(135deg,rgba(139,92,246,.4),rgba(192,38,211,.3)); border:1px solid rgba(192,132,252,.5); border-radius:999px; padding:2px 7px; margin-left:6px; white-space:nowrap; vertical-align:1px;}
  .packtile{position:relative;}
  .ring{position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#E9D5FF; animation:rise .4s ease both;}
  .ring::after{content:""; position:absolute; inset:3px; border-radius:50%; background:rgba(16,12,34,.94);}
  .ring span{position:relative; z-index:1;}
  .quizq{color:var(--text2); font-size:13px; font-weight:700; letter-spacing:.3px; margin-top:6px;}
  .rolegrid{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:370px; padding:0 18px;}
  .rolechip{background:var(--glass); border:1px solid var(--stroke); color:var(--text); font-size:12px; font-weight:700; padding:9px 14px; border-radius:999px; cursor:pointer; backdrop-filter:blur(10px); transition:all .2s;}
  .rolechip:hover{border-color:rgba(192,132,252,.6); box-shadow:0 0 16px rgba(139,92,246,.3); transform:translateY(-1px);}
  .risebadge{position:absolute; left:10px; background:linear-gradient(135deg,#F59E0B,#EF4444); color:#fff; font-size:11px; font-weight:800; padding:6px 11px; border-radius:999px; box-shadow:0 4px 16px rgba(239,68,68,.45); animation:pulse 2s ease-in-out infinite;}
  #achToast{pointer-events:none; position:fixed; left:50%; transform:translateX(-50%) translateY(150px); bottom:calc(94px + env(safe-area-inset-bottom)); z-index:150; background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(192,38,211,.92)); border:1px solid rgba(240,171,252,.6); color:#fff; padding:12px 20px; border-radius:16px; font-weight:800; font-size:13px; box-shadow:0 10px 40px rgba(139,92,246,.6); transition:transform .5s cubic-bezier(.2,1.4,.4,1); display:flex; gap:10px; align-items:center; max-width:86vw;}
  #achToast.show{transform:translateX(-50%) translateY(0);}
  #achToast .ae{font-size:22px; animation:pulse 1.2s ease-in-out infinite;}
  .scorewrap{display:flex; gap:16px; align-items:center; padding:16px;}
  .scorering{width:88px; height:88px; border-radius:50%; position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .scorering::after{content:""; position:absolute; inset:7px; border-radius:50%; background:rgba(16,12,34,.95);}
  .scorenum{position:relative; z-index:1; font-size:24px; font-weight:900; background:linear-gradient(90deg,#C084FC,#F0ABFC); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .scoremsg{font-size:12px; color:var(--text2); line-height:1.5;}
  .scoremsg b{color:var(--text);}
  .catrow{display:flex; align-items:center; gap:10px; padding:9px 16px; border-top:1px solid rgba(122,111,168,.12); font-size:12px;}
  .catrow .cl{width:118px; flex-shrink:0; font-weight:700;}
  .catbar{flex:1; height:6px; border-radius:99px; background:rgba(122,111,168,.2); overflow:hidden;}
  .catbar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#8B5CF6,#F0ABFC); transition:width .8s ease;}
  .fixbtn{background:linear-gradient(135deg,rgba(139,92,246,.4),rgba(192,38,211,.3)); border:1px solid rgba(192,132,252,.5); color:#E9D5FF; font-size:10px; font-weight:800; padding:4px 10px; border-radius:999px; cursor:pointer; flex-shrink:0;}
  .gaprow{display:flex; gap:9px; align-items:center; padding:8px 16px 8px 30px; font-size:11.5px; border-top:1px dashed rgba(122,111,168,.15); animation:rise .3s ease both;}
  .gaprow img{width:26px; height:26px; border-radius:50%;}
  .achgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px;}
  .achcard{background:rgba(8,6,20,.4); border:1px solid var(--stroke); border-radius:14px; padding:10px 6px; text-align:center;}
  .achcard .e{font-size:22px; display:block; margin-bottom:4px;}
  .achcard .t{font-size:9.5px; font-weight:800; letter-spacing:.2px;}
  .achcard.locked{opacity:.35; filter:grayscale(1);}
  .packback{cursor:pointer; color:var(--accent2); margin-right:2px; user-select:none;}
  .pgrid{display:flex; flex-wrap:wrap; padding:8px 0;}
  .pcell{width:50%; text-align:center; padding:14px 0;}
  .pval{font-size:24px; font-weight:900;}
  .plab{font-size:10px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.6px;}
  .typeline{text-align:center; font-size:12.5px; color:var(--text2); padding:0 12px 14px;}
  .prow{display:flex; align-items:center; gap:11px; padding:13px 15px; border-bottom:1px solid rgba(122,111,168,.12);}
  .prow:last-child{border-bottom:none;}
  .prow img{width:38px; height:38px; border-radius:50%;}
  .pname{font-size:14px; font-weight:700;}
  .psub{font-size:11px; color:var(--muted); margin-top:1px;}
  .pbtn{background:linear-gradient(135deg,#8B5CF6,#C026D3); color:#fff; border:none; font-size:12.5px; font-weight:800; padding:10px 17px; border-radius:999px; cursor:pointer; margin-left:auto; flex-shrink:0;}
  .pbtn.ghost{background:none; color:var(--nope); border:1px solid var(--stroke);}
  .tokinput{flex:1; min-width:0; background:rgba(8,6,20,.5); border:1px solid var(--stroke); border-radius:11px; color:var(--text); font-size:12px; padding:11px 12px; outline:none; font-family:ui-monospace,Menlo,monospace;}
  .tokinput::placeholder{color:var(--muted); font-family:-apple-system,sans-serif;}
  .phint{font-size:10.5px; color:var(--muted); line-height:1.6; padding:2px 15px 13px;}
  .phint a{color:var(--accent2); text-decoration:none;}
  .perr{color:var(--nope); font-size:11px; padding:0 15px 10px; display:none;}

// Keys live only in S.ai (device storage), are sent only to their provider, and are stripped from backups.
const AI_PROVIDERS={
 claude:{label:"Claude",keyUrl:"https://console.anthropic.com/settings/keys",ic:"spark"},
 openai:{label:"ChatGPT",keyUrl:"https://platform.openai.com/api-keys",ic:"chat"},
 pplx:{label:"Perplexity",keyUrl:"https://www.perplexity.ai/settings/api",ic:"search"},
};
function aiKey(p){return p==="claude"?S.ai.claudeKey:p==="openai"?S.ai.openaiKey:p==="pplx"?S.ai.pplxKey:null;}
function aiProvider(){
  const pref=(S.ai&&S.ai.provider)||"auto";
  if(pref!=="auto"&&aiKey(pref))return pref;
  return aiKey("claude")?"claude":aiKey("openai")?"openai":aiKey("pplx")?"pplx":null;
}
function aiLabel(p){return (AI_PROVIDERS[p]||{}).label||p;}
function mcpList(){return (S.mcpServers||[]).filter(m=>m&&/^https?:\/\//i.test(m.url||""));}
function claudeHeaders(key){return {"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};}
// One call, any provider. opts: {system, messages, maxTokens, mcp:false}
async function askAI(prompt,opts){
  opts=opts||{}; const p=opts.provider||aiProvider(); if(!p)throw new Error("noai");
  const system=opts.system||"You are RepoSwipe's assistant inside a GitHub-repo discovery app. Be concise, concrete and practical. Prefer short bullet points and exact commands.";
  const messages=opts.messages||[{role:"user",content:prompt}];
  if(p==="claude"){
    const headers=claudeHeaders(S.ai.claudeKey);
    const body={model:S.ai.claudeModel||"claude-sonnet-4-5",max_tokens:opts.maxTokens||1200,system,messages};
    const mcp=opts.mcp===false?[]:mcpList();
    if(mcp.length){ headers["anthropic-beta"]="mcp-client-2025-04-04";
      body.mcp_servers=mcp.map((m,i)=>{const o={type:"url",url:m.url,name:(String(m.name||"server"+i).replace(/[^a-zA-Z0-9_-]/g,"-").slice(0,40)||"server"+i)};if(m.token)o.authorization_token=m.token;return o;}); }
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify(body)});
    if(!res.ok){const e=await res.text().catch(()=>"");throw new Error("Claude "+res.status+(e?": "+e.slice(0,160):""));}
    const j=await res.json(); const tools=[];
    const text=(j.content||[]).map(b=>{if(b.type==="text")return b.text;if(b.type==="mcp_tool_use"){tools.push(b.name);return "";}return "";}).join("").trim();
    return {text,tools,provider:p};
  }
  const url=p==="openai"?"https://api.openai.com/v1/chat/completions":"https://api.perplexity.ai/chat/completions";
  const model=p==="openai"?(S.ai.openaiModel||"gpt-4o-mini"):"sonar";
  const res=await fetch(url,{method:"POST",headers:{"content-type":"application/json",Authorization:"Bearer "+aiKey(p)},body:JSON.stringify({model,messages:[{role:"system",content:system},...messages],max_tokens:opts.maxTokens||1200})});
  if(!res.ok){const e=await res.text().catch(()=>"");throw new Error(aiLabel(p)+" "+res.status+(e?": "+e.slice(0,160):""));}
  const j=await res.json(); const ch=(j.choices||[])[0]||{};
  return {text:((ch.message||{}).content||"").trim(),tools:[],provider:p};
}
// Validation = a cheap models listing (no tokens spent). Also discovers a good default model.
async function validateAiKey(p,key){
  if(p==="claude"){
    const res=await fetch("https://api.anthropic.com/v1/models?limit=100",{headers:claudeHeaders(key)}); if(!res.ok)throw 0;
    const ids=((await res.json()).data||[]).map(m=>m.id);
    const pick=ids.find(i=>/sonnet/i.test(i))||ids[0]||"claude-sonnet-4-5";
    S.ai.claudeKey=key; S.ai.claudeModel=pick; save(); return pick;
  }
  if(p==="openai"){
    const res=await fetch("https://api.openai.com/v1/models",{headers:{Authorization:"Bearer "+key}}); if(!res.ok)throw 0;
    const ids=((await res.json()).data||[]).map(m=>m.id);
    const pick=ids.find(i=>i==="gpt-4o-mini")||ids.find(i=>/mini/.test(i)&&/gpt-(4|5)/.test(i))||ids.find(i=>/^gpt-4/.test(i))||ids[0]||"gpt-4o-mini";
    S.ai.openaiKey=key; S.ai.openaiModel=pick; save(); return pick;
  }
  if(p==="pplx"){ if(!/^pplx-/.test(key)&&key.length<20)throw 0; S.ai.pplxKey=key; save(); return "sonar"; }
  throw 0;
}
function disconnectAi(p){ if(p==="claude"){S.ai.claudeKey=null;S.ai.claudeModel="";} if(p==="openai"){S.ai.openaiKey=null;S.ai.openaiModel="";} if(p==="pplx")S.ai.pplxKey=null; save(); }
// MCP: best-effort browser-side probe (initialize → tools/list over Streamable HTTP). CORS may block it —
// that's fine, Claude's MCP connector talks to the server from Anthropic's side regardless.
async function mcpProbe(m){
  const h={"content-type":"application/json","accept":"application/json, text/event-stream"}; if(m.token)h.Authorization="Bearer "+m.token;
  const parse=async res=>{const ct=res.headers.get("content-type")||"";const txt=await res.text();if(ct.includes("text/event-stream")){const line=txt.split("\n").find(l=>l.startsWith("data:"));return line?JSON.parse(line.slice(5)):null;}return txt?JSON.parse(txt):null;};
  const r1=await fetch(m.url,{method:"POST",headers:h,body:JSON.stringify({jsonrpc:"2.0",id:1,method:"initialize",params:{protocolVersion:"2025-06-18",capabilities:{},clientInfo:{name:"RepoSwipe",version:"1.0"}}})});
  if(!r1.ok)throw new Error("http "+r1.status);
  const sid=r1.headers.get("mcp-session-id"); await parse(r1).catch(()=>null);
  const h2={...h}; if(sid)h2["mcp-session-id"]=sid;
  await fetch(m.url,{method:"POST",headers:h2,body:JSON.stringify({jsonrpc:"2.0",method:"notifications/initialized"})}).catch(()=>{});
  const r2=await fetch(m.url,{method:"POST",headers:h2,body:JSON.stringify({jsonrpc:"2.0",id:2,method:"tools/list",params:{}})});
  if(!r2.ok)throw new Error("http "+r2.status);
  const j=await parse(r2); return ((j&&j.result&&j.result.tools)||[]).length;
}
async function addMcpServer(name,url,token){
  url=String(url||"").trim(); name=String(name||"").trim()||url.replace(/^https?:\/\//,"").split("/")[0];
  if(!/^https?:\/\//i.test(url))return null;
  const m={name,url,token:String(token||"").trim()||"",status:"saved",tools:0};
  S.mcpServers=(S.mcpServers||[]).filter(x=>x.url!==url); S.mcpServers.push(m); save();
  try{m.tools=await mcpProbe(m);m.status="ok";}catch(e){m.status=/^http \d+$/.test(e.message||"")?"fail":"saved";}
  save(); return m;
}
function removeMcpServer(url){S.mcpServers=(S.mcpServers||[]).filter(x=>x.url!==url);save();}
// tiny markdown → safe HTML for AI answers (bold, code, bullets, line breaks)
function fmtAi(txt){
  let h=esc(String(txt||""));
  h=h.replace(/```[a-z]*\n?([\s\S]*?)```/g,(m,c)=>'<pre class="aipre">'+c+'</pre>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/^\s*[-*•]\s+(.+)$/gm,'<div class="aib">▸ $1</div>').replace(/^#{1,4}\s+(.+)$/gm,'<div class="aih">$1</div>');
  return h.replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>");
}
// Toolkit Chat: a conversation about a set of repos (your Stack, a pack, or one repo), on your connected AI, with your MCP tools.
function openAiChat(title,repos,firstQuestion){
  closeAiMenu();

  const p=aiProvider();

      <div class="airow" id="chatConnect"><span class="aie">${icon("plug")}</span><div><div class="ain">${esc(t("chat_goconnect"))}</div><div class="ais">${esc(t("chat_noai"))}</div></div><span class="aigo">${icon("external")}</span></div></div>`;
    m.addEventListener("click",e=>{ if(e.target.closest&&e.target.closest("#chatConnect")){closeAiMenu();document.querySelector('.tab[data-tab="profile"]').click();setTimeout(()=>{const el=document.getElementById("aiConnSec");if(el)el.scrollIntoView({behavior:"smooth"});},150);return;} if(e.target===m)closeAiMenu(); });
    document.body.appendChild(m); requestAnimationFrame(()=>m.classList.add("show")); return;
  }
  const ctx=(repos||[]).slice(0,40).map(r=>`- ${r.full_name}${r.description?" — "+r.description:""} (${r.html_url})`).join("\n");
  const system=`You are RepoSwipe's Toolkit Chat. The user is building an AI toolkit from GitHub repos. Context — ${title}:\n${ctx||"(no repos yet)"}\nAnswer concisely with concrete steps and exact commands. If MCP tools are available, use them when they help.`;
  const hist=[];
  m.innerHTML=`<div class="aisheet chatsheet">
    <div class="aihead">${esc(t("chat_title",{title}))} <span class="aipill">${esc(aiLabel(p))}${mcpList().length?" · "+mcpList().length+" MCP":""}</span></div>
    <div class="chatlog" id="chatLog"></div>
    <div class="chatin"><textarea id="chatIn" rows="2" placeholder="${esc(t("chat_ph"))}"></textarea><button class="pbtn" id="chatSend">${esc(t("chat_send"))}</button></div>
  </div>`;
  document.body.appendChild(m); requestAnimationFrame(()=>m.classList.add("show"));
  const log=m.querySelector("#chatLog"), inp=m.querySelector("#chatIn"), btn=m.querySelector("#chatSend");
  const add=(role,html)=>{const d=document.createElement("div");d.className="chatmsg "+role;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;};
  let busy=false;
  async function send(q){
    q=String(q||inp.value||"").trim(); if(!q||busy)return; inp.value=""; busy=true; btn.disabled=true;
    hist.push({role:"user",content:q}); add("user",esc(q));
    const th=add("ai thinking",`<div class="spin" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle"></div> ${esc(t("chat_thinking"))}`);
    try{ const r=await askAI(null,{system,messages:hist.slice(),maxTokens:1400});
      hist.push({role:"assistant",content:r.text||""});
      th.className="chatmsg ai"; th.innerHTML=(r.tools&&r.tools.length?`<div class="aitools">${icon("wrench")} ${esc(t("chat_tools"))}: ${esc(r.tools.join(", "))}</div>`:"")+fmtAi(r.text||"…");
    }catch(e){ hist.pop(); th.className="chatmsg ai err"; th.textContent=t("ai_err",{e:e.message==="noai"?t("chat_noai"):e.message}); }
    busy=false; btn.disabled=false; log.scrollTop=log.scrollHeight;
  }
  btn.addEventListener("click",()=>send());
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  m.addEventListener("click",e=>{if(e.target===m)closeAiMenu();});
  if(firstQuestion)send(firstQuestion); else inp.focus();
}

// ---------- Auto-translate: repo text written in another language is shown in yours ----------
// Engine: your connected AI (Connections) when present, otherwise Google Translate's free endpoint.
// Only repo text (descriptions, README excerpts) is sent — never your Stack, keys or settings. Toggle in the You tab.
const LANG_NAMES={en:"English",es:"Español",fr:"Français",de:"Deutsch",zh:"中文",ja:"日本語",ko:"한국어",ru:"Русский",pt:"Português",it:"Italiano",ar:"العربية",he:"עברית",th:"ไทย",hi:"हिन्दी",tr:"Türkçe",nl:"Nederlands",pl:"Polski",uk:"Українська",vi:"Tiếng Việt",id:"Bahasa Indonesia",fa:"فارسی",sv:"Svenska",cs:"Čeština"};
const TR_SCRIPTS=[[/[\u3040-\u30ff]/g,"ja",.08],[/[\uac00-\ud7af]/g,"ko",.3],[/[\u4e00-\u9fff\u3400-\u4dbf]/g,"zh",.3],[/[\u0400-\u04ff]/g,"ru",.3],[/[\u0600-\u06ff]/g,"ar",.3],[/[\u0590-\u05ff]/g,"he",.3],[/[\u0e00-\u0e7f]/g,"th",.3],[/[\u0900-\u097f]/g,"hi",.3]];
const TR_STOP={en:"the and for with this that from your you are is it to of in on by an as be or can use".split(" "),es:"el la los las de que y para con una un es por del se como más su este esta sus".split(" "),fr:"le la les des est une un pour avec et dans sur ce cette vous qui que du au pas".split(" "),de:"der die das und ist nicht mit für ein eine von zu auf den dem sie werden auch".split(" "),pt:"o os as um uma para com não que do da em por mais seu sua você".split(" "),it:"il lo la gli le di che per con una un non è sono del della questo".split(" ")};
function detectLang(txt){
  const s=String(txt||"").replace(/https?:\/\/\S+/g," ").replace(/`[^`]*`/g," ");
  const letters=(s.match(/\p{L}/gu)||[]).length; if(!letters)return null;
  for(const [re,code,th] of TR_SCRIPTS){const n=(s.match(re)||[]).length;if(n/letters>=th)return code;}
  const words=s.toLowerCase().match(/\p{L}+/gu)||[]; if(words.length<4)return null;
  let best=null,bestScore=0;
  for(const code in TR_STOP){const set=TR_STOP[code];let hits=0;const d=new Set();for(const w of words){if(set.indexOf(w)>=0){hits++;d.add(w);}}const sc=hits/words.length;if(d.size>=2&&sc>bestScore){bestScore=sc;best=code;}}
  return bestScore>=0.12?best:null; // unsure → leave it alone
}
function needsTranslation(txt){ if(!S.autoTranslate)return false; const d=detectLang(txt); return !!d&&d!==S.lang; }
const trCache=new Map();
async function googleTranslate(txt,tl){
  const res=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&dt=t&tl="+encodeURIComponent(tl==="zh"?"zh-CN":tl),{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:"q="+encodeURIComponent(txt)});
  if(!res.ok)throw 0; const j=await res.json();
  return {text:(j[0]||[]).map(x=>(x&&x[0])||"").join(""),from:String(j[2]||"auto").toLowerCase().split("-")[0],via:"google"};
}
// Translate many strings at once; results align with the input. Untranslatable items come back unchanged.
async function translateTexts(texts){
  const tl=S.lang||"en", out=new Array(texts.length), todo=[];
  texts.forEach((x,i)=>{const k=tl+"|"+x;if(trCache.has(k))out[i]=trCache.get(k);else todo.push(i);});
  if(!todo.length)return out;
  const keep=(i,r)=>{trCache.set(tl+"|"+texts[i],r);out[i]=r;};
  const p=aiProvider();
  if(p){
    try{
      const a=await askAI("Translate each item into "+(LANG_NAMES[tl]||tl)+". Keep product names, commands and code unchanged. Reply with ONLY a JSON array, same order, of objects {\"t\":\"translation\",\"from\":\"ISO 639-1 code of the source language\"}.\n"+JSON.stringify(todo.map(i=>texts[i])),{mcp:false,system:"You are a precise translator. Output only JSON.",maxTokens:Math.min(4000,400+todo.reduce((n,i)=>n+texts[i].length,0)*2)});
      const m=String(a.text||"").match(/\[[\s\S]*\]/); const arr=JSON.parse(m?m[0]:a.text);
      if(Array.isArray(arr)&&arr.length===todo.length){todo.forEach((i,j)=>keep(i,{text:String((arr[j]&&arr[j].t)||texts[i]),from:String((arr[j]&&arr[j].from)||"auto").toLowerCase(),via:p}));return out;}
    }catch(e){}
  }
  // Google: one request for the batch when nothing contains a newline (segments come back in order), else one per item
  const multi=todo.length>1&&todo.every(i=>texts[i].indexOf("\n")<0);
  if(multi){
    try{const r=await googleTranslate(todo.map(i=>texts[i]).join("\n"),tl);const parts=r.text.split("\n");
      if(parts.length===todo.length){todo.forEach((i,j)=>keep(i,{text:parts[j].trim(),from:r.from,via:"google"}));return out;}
    }catch(e){}
  }
  await Promise.all(todo.map(async i=>{try{keep(i,await googleTranslate(texts[i],tl));}catch(e){out[i]={text:texts[i],from:null,via:null};}}));
  return out;
}
function trPill(from){const name=LANG_NAMES[from]||String(from||"").toUpperCase()||"?";return '<span class="trpill nodrag" title="'+esc(t("tr_tap"))+'">'+icon("globe")+' '+esc(t("tr_from",{lang:name}))+'</span>';}
// Translate elements' text in place; the pill toggles original ↔ translation
async function translateEls(items){
  const list=items.filter(x=>x.el&&x.text&&needsTranslation(x.text)); if(!list.length)return;
  const res=await translateTexts(list.map(x=>x.text));
  list.forEach((x,i)=>{const r=res[i];if(!r||!r.text||r.text===x.text||!document.contains(x.el))return;
    x.el.dataset.orig=x.text;x.el.dataset.tr=r.text;x.el.dataset.from=r.from||"";x.el.dataset.showing="tr";
    x.el.innerHTML=esc(r.text)+" "+trPill(r.from);});
}

// ---------- Make a Skill: turn any repo into a ready-to-save SKILL.md ----------
function fullNameFromUrl(u){const m=/github\.com\/([^\/\s#?]+)\/([^\/\s#?]+)/.exec(u||"");return m?m[1]+"/"+m[2].replace(/\.git$/,""):null;}
function extractInstall(md){
  const snips=[]; const fence=/```[a-z]*\n([\s\S]*?)```/g; let m;
  while((m=fence.exec(md))&&snips.length<4){
    for(const line of m[1].split("\n")){
      const l=line.replace(/^\$\s*/,"").trim();
      if(/^claude\s+mcp\s+add\b/.test(l)||/^npx\s+(-y\s+)?\S+/.test(l)&&!/create-/.test(l)||/^uvx\s+\S+/.test(l)||/^pip3?\s+install\s+\S+/.test(l)||/^npm\s+i(nstall)?\s+\S+/.test(l)||/^brew\s+install\s+\S+/.test(l)||/^docker\s+(run|compose)\b/.test(l)||/^git\s+clone\s+\S+/.test(l)){ if(snips.indexOf(l)<0)snips.push(l); }
    }
  }
  return snips.slice(0,4);
}
function skillSlug(name){return String(name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48)||"repo-skill";}
function buildSkill(r, md){
  const name=r.name||fullNameFromUrl(r.html_url)||"repo", full=r.full_name||fullNameFromUrl(r.html_url)||name;
  const desc=(r.description||"").trim()||name;
  const bullets=md?parseBullets(md,desc):[desc];
  const install=md?extractInstall(md):[];
  const first=desc.replace(/\s+/g," ").slice(0,140);
  const L=[];
  L.push("---","name: "+skillSlug(name),"description: "+first+(first.endsWith(".")?"":".")+" "+t("skill_use_when",{repo:name}),"---","","# "+full,"",desc,"");
  L.push("## "+t("skill_when"),"- "+t("skill_use_when",{repo:name}),"");
  if(install.length){L.push("## "+t("skill_install"),"```bash",...install,"```","");}
  if(bullets.length){L.push("## "+t("skill_features"),...bullets.map(b=>"- "+b),"");}
  L.push("## "+t("skill_links"),"- "+r.html_url,"- "+r.html_url+"#readme","");
  return L.join("\n");
}
function skillPrompt(skillMd, name){
  const head="Save this as a skill named \""+skillSlug(name)+"\" and confirm when it's saved. Here is the SKILL.md:\n\n";
  const room=1900-head.length;
  const body=skillMd.length>room?skillMd.slice(0,room-20)+"\n…(trimmed)":skillMd;
  return head+body;
}

(function(){
  const c=$("stars"),ctx=c.getContext("2d");let W,H,stars=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,s:Math.random()*.35+.08,tw:Math.random()*Math.PI*2}));}
  size();addEventListener("resize",size);
  (function loop(){

    for(const st of stars){
      st.y-=st.s; st.tw+=.03; if(st.y<-4){st.y=H+4;st.x=Math.random()*W;}
      ctx.globalAlpha=.35+.35*Math.sin(st.tw);
      ctx.fillStyle="#C4B5FD"; ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1; requestAnimationFrame(loop);
  })();
})();

// ---------- particle FX ----------
const FX=(function(){
  const c=$("fx"),ctx=c.getContext("2d");let W,H,parts=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;}
  size();addEventListener("resize",size);
  (function loop(){
    ctx.clearRect(0,0,W,H);
    parts=parts.filter(p=>p.life>0);
    for(const p of parts){
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life-=1; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.min(1,p.life/30);
      ctx.fillStyle=p.col;
      if(p.shape==="heart"){ctx.save();ctx.scale(p.size/24,p.size/24);ctx.translate(-12,-12);ctx.fill(new Path2D(HEART_PATH));ctx.restore();}
      else ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.5);
      ctx.restore();
    }
    ctx.globalAlpha=1; requestAnimationFrame(loop);
  })();
  return {
    burst(x,y,kind){
      const cols=["#C084FC","#8B5CF6","#34D399","#FBBF24","#F0ABFC","#60A5FA"];
      const n=kind==="super"?70:26;
      for(let i=0;i<n;i++){
        const a=Math.random()*Math.PI*2, v=Math.random()*(kind==="super"?9:5)+2;
        parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.22,life:60+Math.random()*40,rot:Math.random()*6,vr:(Math.random()-.5)*.3,size:kind==="super"?(Math.random()*10+6):(Math.random()*7+4),col:cols[i%cols.length],shape:kind==="like"&&i%5===0?"heart":"rect"});
      }
    }
  };
})();

// ---------- "what it does" bullets (extracted live from each repo's README) ----------
const bulletCache=new Map();
function parseBullets(md, desc){
  const out=[];
  const clean=String(md).replace(/```[\s\S]*?```/g,"").replace(/<[^>]+>/g," ");
  // 1) real bullet lines from the README (prefer the author's own feature list)
  for(const raw of clean.split("\n")){
    const m=raw.match(/^\s*[-*+•]\s+(.{8,})/);
    if(!m) continue;
    let t=m[1].replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[*_`#]/g,"").replace(/\s+/g," ").trim();
    if(t.length<20||t.length>170) continue;
    if(/^https?:\/\//i.test(t)) continue;
    if(/license|contributing|star history|sponsor|badge/i.test(t.slice(0,20))) continue;
    if(!out.includes(t)) out.push(t);
    if(out.length>=5) break;
  }
  // 2) not enough? fall back to the opening sentences of the README
  if(out.length<2){
    const text=clean.replace(/^#.*$/gm," ").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[*_`>#|]/g," ").replace(/\s+/g," ");
    // no lookbehind — older Safari crashes at parse time on those patterns
    const sentences=(text.match(/[^.!?]+[.!?]+/g)||[]).map(s=>s.trim()).filter(s=>s.length>=30&&s.length<=190&&/[a-zA-Z]{4}/.test(s)&&!/^https?:/i.test(s));
    for(const s of sentences){ if(out.length>=4)break; if(!out.includes(s)) out.push(s); }
  }
  // 3) still nothing? use the repo description
  if(out.length===0&&desc) out.push(desc);
  return out.slice(0,5);
}
async function getBullets(r){
  if(bulletCache.has(r.id)) return bulletCache.get(r.id);
  if(bulletCache.size>300) bulletCache.clear(); // long sessions: keep memory bounded
  try{
    const res=await fetch(`https://api.github.com/repos/${r.full_name}/readme`,{headers:ghHeaders()});
    trackRate(res); if(!res.ok)throw 0;
    const data=await res.json();
    const text=decodeURIComponent(escape(atob(data.content.replace(/\n/g,"")))).split("\n").slice(0,180).join("\n");
    const b=parseBullets(text, r.description);
    bulletCache.set(r.id,b); return b;
  }catch(e){
    const b=r.description?[r.description]:[t("couldnt_details")];
    bulletCache.set(r.id,b); return b;
  }
}
async function fillBullets(r){
  if(!r) return;
  const b=await getBullets(r);
  const host=stage.querySelector(`.bul[data-id="${r.id}"]`);
  if(!host||!b.length) return;
  host.innerHTML=b.map(t=>`<li>${esc(t)}</li>`).join("");
  void translateBullets(host,b);
}
// Card bullets: one pill under the list flips every bullet between translation and original
async function translateBullets(host,b){
  const old=host.parentElement&&host.parentElement.querySelector(".trnote"); if(old)old.remove();
  if(!b.some(x=>needsTranslation(x)))return;

  if(!any)return;

// Awesome-list mining: pull curated awesome-mcp-servers lists and hydrate their repos live.
const AWESOME_SOURCES=["punkpeye/awesome-mcp-servers","appcypher/awesome-mcp-servers","wong2/awesome-mcp-servers"];
const AWESOME_PER_PAGE=8;
let awesomeList=null;
function parseRepoLinks(md, exclude){
  const re=/github\.com\/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+?)(?:[\/#?)\s"']|$)/g;
  const out=[], seen=new Set(exclude.map(s=>s.toLowerCase()));
  const bad=new Set(["topics","search","orgs","sponsors","features","settings","site","about","collections","trending","marketplace","apps","login","signup","readme","contact"]);
  let m;
  while((m=re.exec(md))!==null){
    const owner=m[1]; let name=m[2];
    if(!owner||!name||bad.has(owner.toLowerCase()))continue;
    name=name.replace(/\.git$/,"");
    const full=owner+"/"+name, k=full.toLowerCase();
    if(seen.has(k))continue;
    seen.add(k); out.push(full);
  }
  return out;
}
async function loadAwesomeList(){
  if(awesomeList&&awesomeList.length)return awesomeList;
  const parts=await Promise.allSettled(AWESOME_SOURCES.map(async s=>{
    const res=await fetch(`https://api.github.com/repos/${s}/readme`,{headers:ghHeaders()});
    trackRate(res); if(!res.ok)throw 0;
    const d=await res.json();
    return decodeURIComponent(escape(atob(d.content.replace(/\n/g,""))));
  }));
  const ok=parts.filter(p=>p.status==="fulfilled");
  if(ok.length===0)return []; // don't cache failure — retry next page/load (e.g. after connecting a token)
  awesomeList=parseRepoLinks(ok.map(p=>p.value).join("\n"), AWESOME_SOURCES);
  return awesomeList;
}
async function fetchAwesomePage(p){
  const list=await loadAwesomeList();
  const slice=list.slice((p-1)*AWESOME_PER_PAGE, p*AWESOME_PER_PAGE);
  if(!slice.length)return [];
  const results=await Promise.allSettled(slice.map(async full=>{
    const res=await fetch(`https://api.github.com/repos/${full}`,{headers:ghHeaders()});
    trackRate(res); if(!res.ok)throw 0;
    return res.json();
  }));
  return results.filter(r=>r.status==="fulfilled").map(r=>r.value);
}

async function fetchPage(p){
  const on=allChannels().filter(c=>S.channelsOn[c.key]);
  const jobs=[];
  for(const c of on){
    if(c.key==="awesome"){jobs.push(fetchAwesomePage(p).catch(()=>[]));continue;}
    for(const q of c.qs){
      jobs.push(
        fetch("https://api.github.com/search/repositories?q="+encodeURIComponent(q)+"&sort=updated&per_page=12&page="+p,{headers:ghHeaders()})
        .then(r=>{trackRate(r);if(!r.ok)throw 0;return r.json()}).then(j=>j.items).catch(()=>[])
      );
    }
  }
  return (await Promise.all(jobs)).flat();
}
async function loadFeed(){
  if(packActive){packActive=null;renderChips();} // leaving pack mode — back to the live channel feed
  const gen=++feedGen; // invalidates in-flight fetches from the previous channel mix
  $("loading").style.display="flex"; page=1; feed=[];
  let items=await fetchPage(1);
  if(gen!==feedGen)return; // channels changed mid-fetch — drop stale results
  const byId=new Map(); items.forEach(r=>byId.set(r.id,r));
  const inStack=stackNames();
  feed=[...byId.values()].filter(r=>!isHidden(r.id)&&!inStack.has(r.full_name.toLowerCase())).sort((a,b)=>score(b)-score(a));
  if(routePinned){feed=[routePinned,...feed.filter(x=>x.id!==routePinned.id)];routePinned=null;} // a #/repo/… deep link goes first
  $("loading").style.display="none";
  renderDeck();
}
async function refill(){
  if(packActive)return; // a pack is a fixed set — no live refill
  if(fetchingMore||page>=MAX_PAGES)return; fetchingMore=true;
  const gen=feedGen;
  try{
    page++;
    const items=await fetchPage(page);
    if(gen!==feedGen)return; // feed was reloaded while we were fetching
    const have=new Set(feed.map(r=>r.id));
    const inStack=stackNames();
    const dedup=new Map(); items.forEach(r=>{if(!have.has(r.id)&&!isHidden(r.id)&&!inStack.has(r.full_name.toLowerCase()))dedup.set(r.id,r);});
    feed.push(...[...dedup.values()].sort((a,b)=>score(b)-score(a)));
  }catch(e){}finally{
    fetchingMore=false;
    // re-render AFTER the flag clears, or an empty refill leaves the deck
    // stuck on "Scanning for more repos…" forever
    if(view==="swipe"&&!document.querySelector(".card.top"))renderDeck();
  }
}

    const e=document.createElement("div");e.className="card";
    e.innerHTML=`<div class="empty" style="margin:auto"><span class="e">${fetchingMore?icon("search"):noChannels?icon("radio"):limited?icon("cloud"):icon("sparkle")}</span>${

      ${!fetchingMore&&!noChannels?'<br><br><button class="gbtn" id="retryBtn" style="flex:none;padding:12px 26px">${t("retry")}</button>':""}</div>`;

function hoverTilt(e){
  if(dragging||animating||!topEl)return;
  const rect=topEl.getBoundingClientRect();
  const rx=((e.clientY-rect.top)/rect.height-.5)*-7;
  const ry=((e.clientX-rect.left)/rect.width-.5)*9;
  topEl.style.transition="transform .1s";
  topEl.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
}
function onDown(e){if(animating)return;
  if(e.target.closest&&e.target.closest(".cardbtn,.nodrag,.backfoot,.codebox"))return; // hero buttons + back-side controls are plain clicks
  dragging=true;startX=e.clientX;startY=e.clientY;px=0;py=0;topEl.setPointerCapture(e.pointerId);topEl.style.transition="none";
  topEl.addEventListener("pointermove",onMove);topEl.addEventListener("pointerup",onUp);}
// Hero buttons: open / fork / send-to-Claude (delegation survives re-renders)
stage.addEventListener("click",e=>{
  const ba=e.target.closest&&e.target.closest(".backai");
  if(ba){e.preventDefault();e.stopPropagation();openAiMenu(ba.dataset.url,ba.dataset.name,ba.dataset.desc);return;}
  const b=e.target.closest&&e.target.closest(".cardbtn");
  if(!b)return;
  e.stopPropagation();
  if(b.classList.contains("ailink")){openAiMenu(b.dataset.url,b.dataset.name,b.dataset.desc);return;}
  const url=b.classList.contains("claudelink")?claudeUrl(b.dataset.url):b.dataset.url;
  window.open(url,"_blank","noopener");
});
function setTransform(){
  const rot=Math.max(-13,Math.min(13,px/16));
  topEl.style.transform=`translate(${px}px,${py}px) rotate(${rot}deg)`;
  const W=stage.clientWidth,TH=W*.34,SU=-140;
  const right=Math.min(1,Math.max(0,px/TH)),left=Math.min(1,Math.max(0,-px/TH)),sup=Math.min(1,Math.max(0,py/SU));
  const s=topEl.querySelectorAll(".stamp"),g=topEl.querySelector(".glow");
  const superZone=py<SU&&Math.abs(px)<TH;
  s[0].style.opacity=superZone?0:right; s[1].style.opacity=superZone?0:left; s[2].style.opacity=superZone?1:sup*.7;
  const c=superZone?"var(--super)":(px>=0?"var(--like)":"var(--nope)");
  g.style.borderColor=c; g.style.opacity=Math.max(right,left,sup);
  g.style.boxShadow=`0 0 40px ${superZone?"rgba(251,191,36,.4)":px>=0?"rgba(52,211,153,.35)":"rgba(251,113,133,.35)"}`;
  const nx=stage.querySelector(".card.next");
  if(nx){const p=Math.min(1,Math.max(right,left,sup));nx.style.transform=`scale(${.94+.06*p}) translateY(${18-18*p}px)`;nx.style.opacity=.75+.25*p;}
  const nz=superZone?2:(px>TH?1:(px<-TH?-1:0));
  if(nz!==zone&&nz!==0&&navigator.vibrate)navigator.vibrate(8);
  zone=nz;
}
function onMove(e){if(!dragging)return;px=e.clientX-startX;py=e.clientY-startY;setTransform();}
function onUp(){
  if(!dragging)return;dragging=false;
  const W=stage.clientWidth,TH=W*.34;
  const superCommit=py<-140&&Math.abs(px)<TH;
  if(superCommit)return commit("super");
  if(Math.abs(px)>TH)return commit(px>0?"right":"left");
  if(Math.abs(px)<6&&Math.abs(py)<6){flip();}
  topEl.style.transition="transform .4s cubic-bezier(.2,1.5,.4,1)";topEl.style.transform="";
  topEl.querySelectorAll(".stamp").forEach(x=>x.style.opacity=0);
  const g=topEl.querySelector(".glow"); g.style.opacity=0; g.style.boxShadow="none"; zone=0;
  const nx=stage.querySelector(".card.next");if(nx){nx.style.transition="all .35s";nx.style.transform="scale(.94) translateY(18px)";nx.style.opacity=.75;}
}
function flip(){
  const r=feed[0];if(!r||!topEl)return;flipped=!flipped;
  topEl.innerHTML=flipped?backHTML(r):cardHTML(r);
  if(flipped)loadBack(r,topEl); else void fillBullets(r);
}
function commit(dir){
  const r=feed[0];if(!r||animating)return;animating=true;
  const W=stage.clientWidth;
  const rect=stage.getBoundingClientRect();
  topEl.style.transition="transform .34s ease-out";
  if(dir==="super"){topEl.style.transform=`translate(${px*1.3}px,-950px) rotate(${px/20}deg)`;FX.burst(rect.left+rect.width/2,rect.top+rect.height/3,"super");}
  else{topEl.style.transform=`translate(${(dir==="right"?1:-1)*W*1.7}px,${py+70}px) rotate(${dir==="right"?20:-20}deg)`;
    if(dir==="right")FX.burst(rect.left+rect.width-40,rect.top+rect.height/2,"like");}
  S.swipes[r.id]={dir,at:Date.now()}; S.reviewed++;
  if(dir!=="left"){
    S.stack.unshift({repo:pick(r),superLike:dir==="super",at:Date.now()});
    S.rightSwipes++;
    if(r.language)S.langCounts[r.language]=(S.langCounts[r.language]||0)+1;
    if(packActive)trackPackGot(packActive.id,r.id); // pack-mode swipes count toward the pack ring
  }
  undoHist.unshift({repo:r,dir});if(undoHist.length>10)undoHist.pop();
  save();
  setTimeout(()=>{feed=feed.filter(x=>x.id!==r.id);renderDeck();if(dir==="super")showMatch(r);},310);
}
function pick(r){return {id:r.id,full_name:r.full_name,name:r.name,html_url:r.html_url,description:r.description,language:r.language,topics:(r.topics||[]).slice(0,6),stargazers_count:r.stargazers_count,owner:{login:r.owner.login,avatar_url:r.owner.avatar_url}};}
function buttonCommit(dir){
  if(!feed.length||animating||view!=="swipe")return;
  px=dir==="right"?200:dir==="left"?-200:0; py=dir==="super"?-200:0;
  commit(dir);
}
function undo(){
  if(animating)return; // a swipe is mid-flight — undoing now would double-apply and lose the card
  const h=undoHist.shift();if(!h)return;
  delete S.swipes[h.repo.id];
  S.stack=S.stack.filter(s=>s.repo.id!==h.repo.id);
  S.reviewed=Math.max(0,S.reviewed-1);
  if(h.dir!=="left"){S.rightSwipes=Math.max(0,S.rightSwipes-1);if(h.repo.language&&S.langCounts[h.repo.language])S.langCounts[h.repo.language]--;}
  save(); feed.unshift(h.repo); renderDeck();
}
function showMatch(r){
  const m=$("match");
  m.innerHTML=`<div class="st">${icon("star")} ${t("super_liked")} ${icon("star")}</div><img src="${esc(r.owner.avatar_url)}"><div class="mn">${esc(r.full_name)}</div>
  <div class="ms">${t("pinned_top")}</div><button id="matchClose">${t("keep_swiping")}</button>`;
  m.classList.add("show");
  $("matchClose").addEventListener("click",()=>m.classList.remove("show"));
}
function updateMeta(){
  $("streak").innerHTML=`${icon("flame")} ${S.reviewed}`;
  $("undoBtn").className="abtn undo"+(undoHist.length?" can":"");
  $("stackCount").textContent=S.stack.length?` ${S.stack.length}`:"";
}

// ---------- save to computer ----------
async function saveFile(filename, content, mime){
  if(NATIVE){ nativeSend({type:"save",name:filename,content:String(content),mime:mime||"text/plain"}); toast(t("toast_saved",{f:filename})); return true; }
  try{
    if(window.showSaveFilePicker){
      const ext="."+filename.split(".").pop();
      const handle=await window.showSaveFilePicker({suggestedName:filename, types:[{description:filename.endsWith(".md")?"Markdown":"JSON", accept:{[mime]:[ext]}}]});
      const w=await handle.createWritable(); await w.write(content); await w.close();
      toast(t("toast_saved",{f:filename})); return true;
    }
  }catch(e){
    if(e&&e.name==="AbortError")return false;
  }
  try{
    const blob=new Blob([content],{type:mime});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast(t("toast_downloaded",{f:filename})); return true;
  }catch(e){ toast(t("toast_save_fail")); return false; }
}
function sortedStack(){return [...S.stack].sort((a,b)=>Number(b.superLike)-Number(a.superLike)||b.at-a.at);}
function buildMarkdown(){
  const sorted=sortedStack();
  return ["# My RepoSwipe Stack","",`Exported ${new Date().toISOString().slice(0,10)} · ${sorted.length} repos`,""]
    .concat(sorted.map(s=>`- ${s.superLike?"⭐ ":""}[${s.repo.full_name}](${s.repo.html_url}) — ${s.repo.description||""}`)).join("\n")+"\n";
}
function buildMcpConfig(){
  const servers={};
  for(const s of sortedStack()){
    const r=s.repo, hay=(r.name+" "+(r.topics||[]).join(" ")+" "+(r.description||"")).toLowerCase();
    if(!/\bmcp\b/.test(hay))continue;
    const key=r.name.toLowerCase().replace(/[^a-z0-9-_]/g,"-").replace(/-+/g,"-");
    servers[key]={command:"npx",args:["-y",r.name]};
  }
  return JSON.stringify({_note:"Best-guess starter config generated by RepoSwipe — check each repo's README for the exact install command.",mcpServers:servers},null,2)+"\n";
}
function buildBackup(){
  const state={...S}; delete state.ghToken; delete state.ai; state.mcpServers=(S.mcpServers||[]).map(m=>({name:m.name,url:m.url}));
  return JSON.stringify({app:"reposwipe",version:2,exported_at:new Date().toISOString(),state},null,2)+"\n";
}
function exportFiles(){return [
  ["reposwipe-stack.md", buildMarkdown(), "text/markdown"],
  ["mcp-servers.json", buildMcpConfig(), "application/json"],
  ["reposwipe-backup.json", buildBackup(), "application/json"],
];}
async function saveAllToFolder(){
  if(NATIVE){ for(const [name,content,mime] of exportFiles()){ nativeSend({type:"save",name,content:String(content),mime}); await new Promise(r=>setTimeout(r,900)); } toast(t("toast_saved_folder")); return; }
  try{
    if(window.showDirectoryPicker){
      const dir=await window.showDirectoryPicker({mode:"readwrite"});
      for(const [name,content] of exportFiles()){
        const h=await dir.getFileHandle(name,{create:true});
        const w=await h.createWritable(); await w.write(content); await w.close();
      }
      toast(t("toast_saved_folder")); return;
    }
  }catch(e){ if(e&&e.name==="AbortError")return; }
  for(const [name,content,mime] of exportFiles()){ await saveFile(name,content,mime); await new Promise(r=>setTimeout(r,450)); }
}
async function importBackup(file){
  try{
    const data=JSON.parse(await file.text());
    if(!data||data.app!=="reposwipe"||!data.state||!Array.isArray(data.state.stack))throw 0;
    const keepToken=S.ghToken, keepDevice=S.deviceToken;
    const keepAi=S.ai, keepMcp=S.mcpServers;
    S={...defaults(),...data.state,ghToken:keepToken,deviceToken:data.state.deviceToken||keepDevice,seeded2:true,ai:keepAi,mcpServers:(keepMcp&&keepMcp.length)?keepMcp:(data.state.mcpServers||[])};
    save(); updateMeta(); renderStack(); toast(t("toast_restored",{n:S.stack.length}));
  }catch(e){ toast(t("toast_not_backup")); }
}
// Seeded favorites carry negative synthetic ids; the backend only accepts positive
// ids, so map negatives into a high positive range (far above any real GitHub id).
function wireId(id){return id>0?id:1e12-id;}
async function shareLink(){
  if(S.stack.length===0){toast(t("toast_swipe_first"));return;}
  toast(t("toast_creating_link"));
  try{
    const items=S.stack.map(s=>({repo_id:wireId(s.repo.id),full_name:s.repo.full_name,html_url:s.repo.html_url,description:s.repo.description,language:s.repo.language,topics:s.repo.topics,stars:s.repo.stargazers_count,avatar_url:s.repo.owner.avatar_url,super_like:s.superLike,saved_at:new Date(s.at).toISOString()}));
    const h={"content-type":"application/json","x-device-token":deviceToken()};
    const sy=await fetch(BACKEND+"/sync",{method:"POST",headers:h,body:JSON.stringify({items})}); if(!sy.ok)throw 0;
    const sh=await fetch(BACKEND+"/share",{method:"POST",headers:h,body:JSON.stringify({title:"My AI Toolkit"})}); if(!sh.ok)throw 0;
    const j=await sh.json();
    const url=j.slug?shareLinkFor(j.slug):j.url; // on yeete.ai the link opens the shared Stack inside RepoSwipe
    await navigator.clipboard.writeText(url);
    if(navigator.share){try{await navigator.share({title:"My AI Toolkit",url});}catch(e){}}
    toast(t("toast_link_copied"));
  }catch(e){toast(t("toast_share_unavail"));}
}

const PACKS=PACK_GROUPS.flatMap(g=>g.packs);
const PACKS_UPDATED="2026-11-09"; // bumped by the weekly pack-improvement run
const packCache=new Map();
let openPackId=null, packActive=null;
async function fetchPack(p){
  if(packCache.has(p.id))return packCache.get(p.id);
  // Two live sources, merged: hand-picked essentials (hydrated via /repos, pinned on top)
  // plus star-ranked topic searches. Picks keep the pack strong even when search runs thin.
  const searchJobs=p.qs.map(q=>
    fetch("https://api.github.com/search/repositories?q="+encodeURIComponent(q)+"&sort=stars&order=desc&per_page=10",{headers:ghHeaders()})
    .then(r=>{trackRate(r);if(!r.ok)throw 0;return r.json()}).then(j=>j.items||[]).catch(()=>[]));
  const pickJobs=(p.picks||[]).map(full=>
    fetch("https://api.github.com/repos/"+full,{headers:ghHeaders()})
    .then(r=>{trackRate(r);if(!r.ok)throw 0;return r.json()}).then(r=>{r._pick=true;return r;}).catch(()=>null));
  const [items,picks]=await Promise.all([
    Promise.all(searchJobs).then(a=>a.flat()),
    Promise.all(pickJobs).then(a=>a.filter(Boolean)),
  ]);
  const byId=new Map();
  picks.forEach(r=>byId.set(r.id,r)); // picks first — they win dedupe and keep _pick
  items.forEach(r=>{if(!byId.has(r.id))byId.set(r.id,r);});
  const all=[...byId.values()], byStars=(a,b)=>b.stargazers_count-a.stargazers_count;
  const top=[...all.filter(r=>r._pick).sort(byStars),...all.filter(r=>!r._pick).sort(byStars)].slice(0,20);
  if(top.length)packCache.set(p.id,top); // only cache success — an API-limited fetch retries next open
  return top;
}
function trackPackGot(packId,repoId){
  if(!packId)return;
  const a=S.packGot[packId]||(S.packGot[packId]=[]);
  if(a.indexOf(repoId)<0)a.push(repoId);
}
function addPackRepo(r,packId){
  if(stackNames().has(r.full_name.toLowerCase())){trackPackGot(packId,r.id);return false;}
  S.stack.unshift({repo:pick(r),superLike:false,at:Date.now()});
  S.swipes[r.id]={dir:"right",at:Date.now()};
  if(r.language)S.langCounts[r.language]=(S.langCounts[r.language]||0)+1;
  trackPackGot(packId,r.id);
  feed=feed.filter(x=>x.id!==r.id);
  save(); updateMeta();
  return true;
}
function swipePack(p,repos){
  const inStack=stackNames();
  packActive=p;
  feed=repos.filter(r=>!isHidden(r.id)&&!inStack.has(r.full_name.toLowerCase()));
  document.querySelector('.tab[data-tab="swipe"]').click();
  renderChips(); renderDeck();
  toast(t("toast_pack_loaded",{title:packTitle(p)}));
}
function exitPack(){packActive=null;renderChips();loadFeed();}
function renderPacks(){
  const el=$("packsview");
  if(openPackId){
    const p=PACKS.find(x=>x.id===openPackId);
    if(p){void renderPackDetail(p);return;}
    openPackId=null;
  }
  if(/^#\/pack\//.test(location.hash)){try{history.replaceState(null,"",location.pathname);}catch(e){}}
  el.innerHTML=`<div class="vtitle">${t("starter_packs")}</div>
    <div class="phint" style="margin:-4px 4px 10px">${t("packs_hint",{n:PACKS.length})} <span style="white-space:nowrap">${t("tuned",{date:PACKS_UPDATED})}</span></div>
    <input class="packsearch" id="packSearch" placeholder="${t("find_job")}" autocomplete="off">
    ${PACK_GROUPS.map(g=>`<div class="packgroup">
      <div class="seclabel" style="margin-top:14px">${esc(groupLabel(g.group).toUpperCase())} · ${g.packs.length}</div>
      <div class="packgrid">${g.packs.map((p,i)=>`
        <div class="packtile" data-id="${p.id}" data-q="${esc((p.title+" "+p.blurb+" "+g.group+" "+packTitle(p)+" "+packBlurb(p)+" "+groupLabel(g.group)).toLowerCase())}" style="animation-delay:${Math.min(i*35,350)}ms">
          ${(S.packGot[p.id]||[]).length?`<div class="ring" title="${Math.min(10,S.packGot[p.id].length)}/10 collected" style="background:conic-gradient(#C084FC ${Math.min(1,S.packGot[p.id].length/10)*360}deg, rgba(122,111,168,.25) 0)"><span>${Math.min(10,S.packGot[p.id].length)}</span></div>`:""}
          <span class="pe">${icon(p.emoji)}</span>
          <div class="pt">${esc(packTitle(p))}</div>
          <div class="pb">${esc(packBlurb(p))}</div>
        </div>`).join("")}</div>
    </div>`).join("")}
    <div class="empty" id="packNone" style="display:none"><span class="e">${icon("search")}</span>${t("no_role")}</div>`;
  el.querySelectorAll(".packtile").forEach(t=>t.addEventListener("click",()=>{openPackId=t.dataset.id;renderPacks();}));
  const ps=el.querySelector("#packSearch");
  ps.addEventListener("input",()=>{
    const f=ps.value.trim().toLowerCase();
    el.querySelectorAll(".packtile").forEach(t=>{t.style.display=!f||t.dataset.q.indexOf(f)>-1?"":"none";});
    let any=false;
    el.querySelectorAll(".packgroup").forEach(g=>{
      const vis=[...g.querySelectorAll(".packtile")].some(t=>t.style.display!=="none");
      g.style.display=vis?"":"none"; if(vis)any=true;
    });
    el.querySelector("#packNone").style.display=any?"none":"block";
  });
}
async function renderPackDetail(p){
  const el=$("packsview");
  try{history.replaceState(null,"",location.pathname+"#/pack/"+p.id);}catch(e){} // the address bar is the pack's shareable link
  el.innerHTML=`<div class="vtitle"><span class="packback" id="packBack" title="${t("all_packs")}">‹</span> ${icon(p.emoji)} ${esc(packTitle(p))} ${t("pack_word")}</div>
    <div class="loading" style="position:static;display:flex;padding:70px 0"><div class="spin"></div>${t("ranking",{title:esc(packTitle(p))})}</div>`;
  el.querySelector("#packBack").addEventListener("click",()=>{openPackId=null;renderPacks();});
  const repos=await fetchPack(p);
  if(openPackId!==p.id||view!=="packs")return; // user navigated away mid-fetch
  const inStack=stackNames();
  el.innerHTML=`<div class="vtitle"><span class="packback" id="packBack" title="${t("all_packs")}">‹</span> ${icon(p.emoji)} ${esc(packTitle(p))} ${t("pack_word")}</div>
    <div class="phint" style="margin:-4px 4px 10px">${esc(packBlurb(p))} — ${repos.filter(r=>r._pick).length?`${icon("pin")} ${t("essentials_prefix")}`:""}${t("top_by_stars",{n:repos.length})}</div>
    ${repos.length?`<div class="btnrow">
      <button class="gbtn" id="packSwipe">${t("swipe_these")} ${icon("flame")}</button>
      <button class="gbtn alt" id="packAddTop">${t("add_top10")} ${icon("heart")}</button>
    </div>
    <div class="btnrow"><button class="gbtn alt" id="packAsk">${icon("sparkle")} ${t("ask_ai_pack")}${aiProvider()?" · "+esc(aiLabel(aiProvider())):""}</button><button class="gbtn alt" id="packShare" style="flex:0 0 auto" title="${esc(t("pack_share"))}">${icon("link")}</button></div>`:""}
    <div class="glasscard">${repos.length?repos.map((r,i)=>{
      const got=inStack.has(r.full_name.toLowerCase());
      return `<div class="srow" data-url="${esc(r.html_url)}" style="animation-delay:${Math.min(i*40,400)}ms" title="${t("t_open")}">
        <img src="${esc(r.owner.avatar_url)}" onerror="this.style.visibility='hidden'">
        <div style="min-width:0"><div class="sn">${esc(r.full_name)} <span class="packstar">${icon("star","stari")} ${compact(r.stargazers_count)}</span>${r._pick?'<span class="picktag">'+icon("pin")+' '+t("essential_tag")+'</span>':""}</div>
        <div class="sd">${r.description?esc(r.description):""}</div></div>
        <div class="rowbtns"><button class="mini packadd" data-i="${i}" title="${got?t("in_stack"):t("add_to_stack")}">${got?"✓":"+"}</button></div>
      </div>`;}).join("")
    :`<div class="empty"><span class="e">${icon("cloud")}</span>${t("api_tapped_min")}</div>`}</div>`;
  el.querySelector("#packBack").addEventListener("click",()=>{openPackId=null;renderPacks();});
  el.querySelectorAll(".srow[data-url]").forEach(row=>row.addEventListener("click",e=>{
    if(e.target.closest(".rowbtns"))return;
    window.open(row.dataset.url,"_blank","noopener");
  }));
  translateDescs(el);
  el.querySelectorAll(".packadd").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    const r=repos[+b.dataset.i];
    if(addPackRepo(r,p.id)){b.textContent="✓";b.title=t("in_stack");toast(t("toast_added_stack",{name:r.name}));}
    else toast(t("toast_already_stack"));
  }));
  const sw=el.querySelector("#packSwipe");
  if(sw)sw.addEventListener("click",()=>swipePack(p,repos));
  const pa=el.querySelector("#packAsk");
  if(pa)pa.addEventListener("click",()=>openAiChat(packTitle(p)+" "+t("pack_word"),repos));
  const psh=el.querySelector("#packShare");
  if(psh)psh.addEventListener("click",async()=>{const u=packLink(p);try{await navigator.clipboard.writeText(u);}catch(e){}if(navigator.share){try{await navigator.share({title:packTitle(p)+" · RepoSwipe",url:u});}catch(e){}}toast(t("pack_link_copied"));});
  const at=el.querySelector("#packAddTop");
  if(at)at.addEventListener("click",()=>{
    let n=0;
    for(const r of repos.slice(0,10)) if(addPackRepo(r,p.id))n++;
    toast(n?t("toast_added_n",{n:n}):t("toast_all_already"));
    void renderPackDetail(p); // refresh the ✓ marks (cache makes this instant)
  });
}

let _achBusy=false; const achQueue=[]; let achShowing=false;
function showAchToast(){
  if(achShowing||!achQueue.length)return;
  achShowing=true;
  const a=achQueue.shift(), el=$("achToast");
  el.querySelector(".ae").innerHTML=icon(a.emoji);
  el.querySelector(".at").textContent=t("ach_unlocked",{title:achT(a)});
  el.classList.add("show");
  if(navigator.vibrate&&navigator.userActivation&&navigator.userActivation.hasBeenActive)navigator.vibrate([10,40,10]);
  setTimeout(()=>{el.classList.remove("show");achShowing=false;setTimeout(showAchToast,450);},2400);
}
function checkAch(){
  if(_achBusy)return; _achBusy=true;
  try{
    let changed=false;
    for(const a of ACH){
      if(S.achUnlocked[a.id])continue;
      let hit=false; try{hit=a.test();}catch(e){}
      if(hit){S.achUnlocked[a.id]=Date.now();achQueue.push(a);changed=true;}
    }
    if(changed){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} showAchToast();}
  }finally{_achBusy=false;}
}

// ---------- AI Setup Score: how complete is your AI toolkit? ----------
const AI_CATS=[
 {id:"mcp",ic:"plug",label:"MCP servers",re:/\bmcp\b|model.context.protocol/i,q:'topic:mcp stars:>500'},
 {id:"agents",ic:"bot",label:"AI agents",re:/agent|autonom|crew|swarm/i,q:'topic:ai-agents stars:>2000'},
 {id:"code",ic:"code",label:"AI coding",re:/\bcode\b|coding|copilot|\bide\b|developer/i,q:'topic:ai-coding stars:>1000'},
 {id:"rag",ic:"brain",label:"Memory / RAG",re:/\brag\b|retriev|knowledge|memory|vector|embedding|second.brain/i,q:'topic:rag stars:>1000'},
 {id:"auto",ic:"gear",label:"Automation",re:/automat|workflow|pipeline|scraper|n8n|zapier/i,q:'topic:workflow-automation stars:>1000'},
 {id:"learn",ic:"grad",label:"Learning",re:/course|tutorial|guide|learn|beginner|hands.on|book|skills/i,q:'topic:llm stars:>5000'},
];
function catHits(cat){
  return S.stack.filter(s=>{
    const r=s.repo, hay=r.full_name+" "+(r.description||"")+" "+(r.topics||[]).join(" ");
    return cat.re.test(hay);
  }).length;
}
function aiScore(){
  let sc=0;
  for(const c of AI_CATS){const h=catHits(c); sc+=h>=3?16:h===2?14:h===1?10:0;}
  if(S.stack.length>=15)sc+=4;
  return Math.min(100,sc);
}
function scoreMsg(sc,gaps){
  if(sc>=85)return t("score_elite");
  if(sc>=60)return t("score_strong_pre")+(gaps.length?(gaps.length===1?t("score_fill_one"):t("score_fill_couple")):t("score_deepen"));
  if(sc>=30)return t("score_good",{n:gaps.length,cat:gaps.length===1?t("cat_singular"):t("cat_plural")});
  return t("score_begin");
}
async function gapFill(cat,slot){
  slot.innerHTML=`<div class="gaprow"><div class="spin" style="width:16px;height:16px;border-width:2px"></div>${t("finding_best",{label:esc(catLabel(cat))})}</div>`;
  try{
    const res=await fetch("https://api.github.com/search/repositories?q="+encodeURIComponent(cat.q)+"&sort=stars&order=desc&per_page=6",{headers:ghHeaders()});
    trackRate(res); if(!res.ok)throw 0;
    const items=((await res.json()).items||[]).filter(r=>!stackNames().has(r.full_name.toLowerCase())).slice(0,3);
    if(!items.length)throw 0;
    slot.innerHTML=items.map((r,i)=>`<div class="gaprow"><img src="${esc(r.owner.avatar_url)}" onerror="this.style.visibility='hidden'">
      <div style="min-width:0;flex:1"><b>${esc(r.full_name)}</b> <span class="packstar">${icon("star","stari")} ${compact(r.stargazers_count)}</span><div class="sd">${r.description?esc(r.description):""}</div></div>
      <button class="mini gapadd" data-i="${i}">+</button></div>`).join("");
    slot.querySelectorAll(".gapadd").forEach(b=>b.addEventListener("click",()=>{
      const r=items[+b.dataset.i];
      if(addPackRepo(r)){b.textContent="✓";toast(t("toast_gap_closing",{name:r.name}));renderProfile();}
    }));
  }catch(e){slot.innerHTML=`<div class="gaprow">${t("toast_api_tapped")}</div>`;}
}

    try{ await validateAiKey(p,key); renderProfile(); toast(t("ai_connected")); }
    catch(e){ err.textContent=t("ai_rejected"); err.style.display="block"; b.disabled=false; }
  }));
  el.querySelectorAll(".aiout").forEach(b=>b.addEventListener("click",()=>{disconnectAi(b.dataset.ai);renderProfile();}));
  const ad=el.querySelector("#aiDefault"); if(ad)ad.addEventListener("change",()=>{S.ai.provider=ad.value;save();});
  const mcpAdd=el.querySelector("#mcpAdd");
  if(mcpAdd)mcpAdd.addEventListener("click",async()=>{
    const url=el.querySelector("#mcpUrl").value; if(!/^https?:\/\//i.test(url.trim()))return;
    mcpAdd.disabled=true;
    const m=await addMcpServer(el.querySelector("#mcpName").value,url,el.querySelector("#mcpTok").value);
    renderProfile(); if(m)toast(m.status==="ok"?t("mcp_ok",{n:m.tools}):m.status==="fail"?t("mcp_fail"):t("mcp_saved"));
  });
  el.querySelectorAll(".mcpdel").forEach(b=>b.addEventListener("click",()=>{removeMcpServer(b.dataset.url);renderProfile();}));
  const lsel=el.querySelector("#langSel"); if(lsel){lsel.value=S.lang; lsel.addEventListener("change",()=>setLang(lsel.value));}
  const trt=el.querySelector("#trToggle"); if(trt)trt.addEventListener("click",()=>{S.autoTranslate=!S.autoTranslate;save();renderProfile();});
}

// ---------- chrome ----------
const chipsEl=$("channelChips");
function renderChips(){
  chipsEl.innerHTML="";
  if(packActive){
    // pack mode: one chip — the pack you're swiping, ✕ returns to the live feed
    const b=document.createElement("button");
    b.className="chchip on"; b.id="packChip";
    b.innerHTML=`${icon("gift")} ${esc(packTitle(packActive))} ${t("pack_lower")}<span class="x" title="${t("back_to_feed")}">✕</span>`;
    b.addEventListener("click",exitPack);
    chipsEl.appendChild(b);
    return;
  }
  for(const c of allChannels()){
    const b=document.createElement("button");
    b.className="chchip"+(S.channelsOn[c.key]?" on":"");
    b.innerHTML=icon(c.ic||"sparkle")+" "+esc(chanLabel(c))+(c.custom?'<span class="x" title="'+t("remove")+'">✕</span>':"");
    b.addEventListener("click",e=>{
      if(c.custom&&e.target.classList.contains("x")){removeCustomChannel(c.key);renderChips();loadFeed();return;}
      S.channelsOn[c.key]=!S.channelsOn[c.key];save();b.classList.toggle("on",S.channelsOn[c.key]);loadFeed();
    });
    chipsEl.appendChild(b);
  }
  // add-your-own channel (any topic or GitHub search query — fetched live)
  const plus=document.createElement("button");
  plus.className="chchip"; plus.id="addChipBtn"; plus.innerHTML=icon("plus");
  plus.title=t("add_channel_title");
  const input=document.createElement("input");
  input.className="addinput"; input.id="addChipInput"; input.placeholder=t("add_channel_ph");
  plus.addEventListener("click",()=>{input.classList.toggle("show");if(input.classList.contains("show"))input.focus();});
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&addCustomChannel(input.value)){input.value="";input.classList.remove("show");renderChips();loadFeed();toast(t("toast_channel_added"));}
    if(e.key==="Escape")input.classList.remove("show");
  });
  chipsEl.appendChild(plus); chipsEl.appendChild(input);
}
renderChips();
function syncChips(){renderChips();}
$("undoBtn").addEventListener("click",undo);
$("nopeBtn").addEventListener("click",()=>buttonCommit("left"));
$("likeBtn").addEventListener("click",()=>buttonCommit("right"));
$("supBtn").addEventListener("click",()=>buttonCommit("super"));
$("flipBtn").addEventListener("click",flip);

document.addEventListener("keydown",e=>{
