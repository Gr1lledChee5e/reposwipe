$("startBtn").addEventListener("click",()=>{$("splash").classList.add("hide");S.splashSeen=true;save();});
if(S.splashSeen){$("splash").classList.add("hide");}

// ---------- apply localization to static chrome ----------
function applyStaticI18n(){
  try{document.documentElement.lang=S.lang;}catch(e){}
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=t(e.dataset.i18n);});
  const L=$("loading"); if(L)L.innerHTML='<div class="spin"></div>'+t("loading");
  const setT=(id,k)=>{const e=$(id);if(e)e.title=t(k);};
  setT("undoBtn","t_undo");setT("nopeBtn","t_pass");setT("supBtn","t_super");setT("likeBtn","t_add");setT("flipBtn","t_details");
  const lv=$("live");if(lv)lv.title=t("t_live");
  document.querySelectorAll(".langsel").forEach(s=>{s.value=S.lang;});
}
function setLang(v){
  if(!I18N[v])v="en";
  S.lang=v; save(); applyStaticI18n(); buildQuiz(); renderChips();
  if(view==="packs")renderPacks();
  else if(view==="stack")renderStack();
  else if(view==="profile")renderProfile();
  else if(view==="swipe")renderDeck();
  updateMeta();
}
document.querySelectorAll(".langsel").forEach(s=>s.addEventListener("change",()=>setLang(s.value)));

// ---------- deep links: every pack, repo and shared Stack has a URL on yeete.ai ----------
//   #/pack/<id>            → opens that Starter Pack            (also /pack/<id>/ — static OG stub pages)
//   #/repo/<owner>/<name>  → puts that repo on top of the deck   (also /repo/<owner>/<name>)
//   #/add/<owner>/<name>   → adds that repo to your Stack        (the Chrome extension's "Swipe this" button)
//   #/s/<slug>             → opens a shared Stack in-app          (share links now point here, not at Supabase)
const SITE_ORIGIN="https://swipe.yeete.ai";
function siteOrigin(){return (/^https?:$/.test(location.protocol)&&!/reposwipe\.local$/.test(location.hostname))?location.origin:SITE_ORIGIN;}
function routeFromLocation(){
  // pretty paths are served by the host's 404 fallback (= this app); normalize them to the hash form
  const pm=/^\/(pack|repo|add|s)\/([^?#]+?)\/?$/.exec(location.pathname||"");
  if(pm){const h="#/"+pm[1]+"/"+pm[2];try{history.replaceState(null,"","/"+h);}catch(e){}return h;}
  return location.hash||"";
}
function parseRoute(h){
  const m=/^#\/(pack|repo|add|s)\/(.+)$/.exec(String(h||"")); if(!m)return null;
  const kind=m[1], rest=m[2].replace(/\/+$/,"").split("/").map(x=>{try{return decodeURIComponent(x);}catch(e){return x;}});
  if(kind==="pack"||kind==="s")return /^[\w.-]{1,80}$/.test(rest[0]||"")?{kind,id:rest[0]}:null;
  if(rest.length<2||!/^[\w.-]+$/.test(rest[0])||!/^[\w.-]+$/.test(rest[1]))return null;
  return {kind,full:rest[0]+"/"+rest[1].replace(/\.git$/,"")};
}
function dismissSplash(){$("splash").classList.add("hide");if(!S.splashSeen){S.splashSeen=true;save();}}
function packLink(p){return siteOrigin()+"/pack/"+p.id+"/";}
function repoLink(full){return siteOrigin()+"/#/repo/"+full;}
function shareLinkFor(slug){return siteOrigin()+"/#/s/"+slug;}
let routePinned=null, routeBusy=false;
async function fetchRepoFull(full){
  const res=await fetch("https://api.github.com/repos/"+full,{headers:ghHeaders()}); trackRate(res);
  if(!res.ok)throw res.status;
  return res.json();
}
async function handleRoute(h){
  const r=parseRoute(h); if(!r||routeBusy)return false; routeBusy=true;
  try{
    if(r.kind==="pack"){
      const p=PACKS.find(x=>x.id===r.id); if(!p){toast(t("route_badpack"));return false;}
      dismissSplash(); openPackId=p.id; document.querySelector('.tab[data-tab="packs"]').click(); return true;
    }
    if(r.kind==="s"){dismissSplash();await openSharedStack(r.id);return true;}
    dismissSplash(); toast(t("route_loading",{repo:r.full}));
    let repo; try{repo=await fetchRepoFull(r.full);}catch(st){toast(st===404?t("route_notfound"):t("toast_api_tapped"));return false;}
    if(r.kind==="add"){
      const added=addPackRepo(repo,null);
      toast(added?t("toast_added_stack",{name:repo.name}):t("toast_already_stack"));
      document.querySelector('.tab[data-tab="stack"]').click();
      try{history.replaceState(null,"",location.pathname);}catch(e){} // one-shot action — don't re-add on reload
      return true;
    }
    // repo: pin it on top of the deck (loadFeed applies it if the feed is still loading)
    routePinned=repo; packActive=null;
    document.querySelector('.tab[data-tab="swipe"]').click();
    if($("loading").style.display==="none"){feed=[repo,...feed.filter(x=>x.id!==repo.id)];routePinned=null;renderChips();renderDeck();}
    toast(t("repo_pinned",{name:repo.name}));
    return true;
  }finally{routeBusy=false;}
}
function unwireId(id){return id>1e12?1e12-id:id;}
async function openSharedStack(slug){
  document.querySelector('.tab[data-tab="stack"]').click();
  const el=$("stackview");
  el.innerHTML=`<div class="vtitle">${t("shared_stack")}</div><div class="loading" style="position:static;display:flex;padding:70px 0"><div class="spin"></div>${t("loading")}</div>`;
  let d;
  try{const res=await fetch(BACKEND+"/share/"+encodeURIComponent(slug),{headers:{accept:"application/json"}});if(!res.ok)throw 0;d=await res.json();}
  catch(e){toast(t("shared_fail"));renderStack();return;}
  if(view!=="stack")return;
  const items=(d.items||[]).map(i=>{const [login,name]=String(i.full_name||"/").split("/");return {id:unwireId(+i.repo_id),full_name:i.full_name,name:name||i.full_name,html_url:i.html_url,description:i.description||"",language:i.language||null,topics:i.topics||[],stargazers_count:+i.stars||0,owner:{login:login||"",avatar_url:i.avatar_url||""},superLike:!!i.super_like};});
  const inStack=stackNames();
  el.innerHTML=`<div class="vtitle"><span class="packback" id="shBack" title="${t("your_stack")}">‹</span> ${icon("link")} ${esc(d.title||t("shared_stack"))}</div>
    <div class="phint" style="margin:-4px 4px 10px">${t("shared_hint",{n:items.length,date:String(d.created_at||"").slice(0,10)})}</div>
    <div class="btnrow"><button class="gbtn" id="shAddAll">${t("shared_add_all")} ${icon("heart")}</button><button class="gbtn alt" id="shMine">${t("your_stack")}</button></div>
    <div class="glasscard" id="shList">${items.length?items.map((r,i)=>`<div class="srow" data-url="${esc(r.html_url)}" style="animation-delay:${Math.min(i*40,400)}ms" title="${t("t_open")}">
      <img src="${esc(r.owner.avatar_url)}" onerror="this.style.visibility='hidden'">
      <div style="min-width:0"><div class="sn">${r.superLike?icon("star","stari")+" ":""}${esc(r.full_name)} <span class="packstar">${icon("star","stari")} ${compact(r.stargazers_count)}</span></div><div class="sd">${esc(r.description)}</div></div>
      <div class="rowbtns"><button class="mini shadd" data-i="${i}" title="${inStack.has(r.full_name.toLowerCase())?t("in_stack"):t("add_to_stack")}">${inStack.has(r.full_name.toLowerCase())?"✓":"+"}</button></div></div>`).join("")
    :`<div class="empty"><span class="e">${icon("heartcrack")}</span>${t("no_matches")}</div>`}</div>`;
  const back=()=>{try{history.replaceState(null,"",location.pathname);}catch(e){}renderStack();};
  el.querySelector("#shBack").addEventListener("click",back);
  el.querySelector("#shMine").addEventListener("click",back);
  el.querySelectorAll(".srow[data-url]").forEach(row=>row.addEventListener("click",e=>{if(e.target.closest(".rowbtns"))return;window.open(row.dataset.url,"_blank","noopener");}));
  translateDescs(el);
  el.querySelectorAll(".shadd").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const r=items[+b.dataset.i];if(addPackRepo(r,null)){b.textContent="✓";toast(t("toast_added_stack",{name:r.name}));}else toast(t("toast_already_stack"));}));
  el.querySelector("#shAddAll").addEventListener("click",()=>{let n=0;for(const r of items)if(addPackRepo(r,null))n++;toast(n?t("toast_added_n",{n}):t("toast_all_already"));el.querySelectorAll(".shadd").forEach(b=>b.textContent="✓");});
}
addEventListener("hashchange",()=>{void handleRoute(location.hash);});

// boot
(async()=>{
  const route0=routeFromLocation(), r0=parseRoute(route0);
  if(S.ghToken){
    try{const res=await fetch("https://api.github.com/user",{headers:ghHeaders()});trackRate(res);if(res.ok)ghUser=await res.json();else{S.ghToken=null;save();}}catch(e){}
  }
  applyStaticI18n();
  updateMeta();
  checkAch(); // unlock anything the saved state already earned (toasts queue politely)
  if(r0&&r0.kind!=="repo")void handleRoute(route0);
  loadFeed();
  if(r0&&r0.kind==="repo")void handleRoute(route0);
})();
</script>
