# One-time importer: when reposwipe-src.zip lands in the repo root, unpack it into the tree and remove the zip.
# (Workflow files themselves are uploaded separately — GITHUB_TOKEN may not create or change them.)
name: Import source from zip
on:
  push:
    paths: ["reposwipe-src.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          if [ ! -f reposwipe-src.zip ]; then echo "nothing to import"; exit 0; fi
          mkdir -p /tmp/src && unzip -oq reposwipe-src.zip -d /tmp/src
          rm -rf /tmp/src/.git /tmp/src/.github
          cp -a /tmp/src/. ./
          rm -f reposwipe-src.zip
          git config user.name "reposwipe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import RepoSwipe v9 source: web app, Chrome extension, build + tests"
          git push
